<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Favorites Bot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2328cc95'/%3E%3Cpath d='M10 23V9.5h12M10 16h9' stroke='%23000' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try { var k = localStorage.getItem("skin"); if (k) document.documentElement.dataset.skin = k; } catch (e) {}</script>
<style>
/*
 * A quiet take on a prediction-market exchange: near-black page, hairlines, a mint accent, outlined Yes/No
 * pills, pill buttons. It leads with the account value, a chart and the open positions; everything else
 * sits in one-line rows that open on tap. Gain/loss colours pass the CVD check (deutan ΔE 12.6) and never stand
 * alone: every gain or loss carries a sign, an arrow and a label. The page is dark only; test_dark_theme.py checks
 * every colour pairing.
 */
:root {
  color-scheme: dark;
  --page: #0a0c0f; --surface: #0f1216; --surface-2: #151a20; --hover: rgba(255, 255, 255, 0.04);
  --line: rgba(255, 255, 255, 0.09); --line-strong: rgba(255, 255, 255, 0.18);
  --ink: rgba(255, 255, 255, 0.92); --ink-2: rgba(255, 255, 255, 0.72); --muted: rgba(255, 255, 255, 0.55); --brand-ink: #28cc95;
  --up: #28cc95; --up-ink: #28cc95; --up-wash: rgba(40, 204, 149, 0.12); --up-line: rgba(40, 204, 149, 0.40);
  --down: #e5484d; --down-ink: #f0616d; --down-wash: rgba(229, 72, 77, 0.13); --down-line: rgba(229, 72, 77, 0.45);
  --warn: #f0a63a; --warn-ink: #f4b45a; --warn-wash: rgba(240, 166, 58, 0.12); --warn-line: rgba(240, 166, 58, 0.45);
  --series-1: #3987e5;
  --series-2: #a68cf0; --series-3: #2fa8b4;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --cond: "Bahnschrift SemiCondensed", "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  /* the scales (one definition, shared with live_research.css):
     7 type sizes, 7 spaces, 3 radii */
  --fs-1: 11px; --fs-2: 12.5px; --fs-3: 13.5px; --fs-4: 15px; --fs-5: 20px; --fs-6: 26px; --fs-7: 60px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
  --r-1: 6px; --r-2: 10px; --r-pill: 999px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }          /* so a display rule below can never un-hide it */
html { -webkit-text-size-adjust: 100%; }
/* one face for numbers: every digit the same width, so columns line up without a monospace font */
body { margin: 0; background: var(--page); color: var(--ink); font: var(--fs-4)/1.45 var(--sans); font-variant-numeric: tabular-nums; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3, b, strong { font-weight: 600; }     /* two weights: 400 for text, 600 for titles and key figures */
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: var(--r-1); }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.u { color: var(--muted); }                         /* a unit beside its number: the digits carry the weight */
.up { color: var(--up-ink); }
.down { color: var(--down-ink); }
.part { color: var(--warn-ink); }                   /* an order that filled only in part */
.s { font-size: var(--fs-2); }
.only-sm { display: none; }                         /* words only a phone shows, for a column it hides (.hide-sm) */
.k { font: 400 var(--fs-2)/1.3 var(--sans); color: var(--muted); }   /* a figure's label: plain words, as on Live Research */
body.offline main { opacity: 0.55; transition: opacity 0.2s; }

/* ------------------------------------------------------------- header */
.top { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--line); }
:root { --gutter: clamp(16px, 3vw, 40px); }
.top-in { max-width: none; margin: 0 auto; padding: 0 var(--gutter); min-height: 60px; display: flex; align-items: center; gap: var(--sp-3); }
.brand { font: 600 var(--fs-5)/1 var(--cond); color: var(--brand-ink); white-space: nowrap; }
/* the tabs: the modes, then Live Research; when the header runs out of room the strip scrolls sideways. Sentence
   case as written; the current one is set apart twice, by weight and by a 2px rule on the header's bottom edge */
.nav { display: flex; align-self: stretch; gap: var(--sp-1); min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav-b { position: relative; flex: none; white-space: nowrap; background: none; border: 0; min-height: 44px; padding: 0 var(--sp-3); border-radius: var(--r-1);
  font: 400 var(--fs-3)/1 var(--sans); color: var(--muted); }
.nav-b:hover { color: var(--ink); }
.nav-b:focus-visible { outline-offset: -2px; }
.nav-b[aria-current="true"] { color: var(--ink); font-weight: 600; }
.nav-b[aria-current="true"]::after { content: ""; position: absolute; left: var(--sp-3); right: var(--sp-3); bottom: 0; height: 2px; background: var(--ink); }
.spacer { flex: 1; }
.status { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-2); color: var(--ink-2); white-space: nowrap; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.pulse.on { background: var(--up); box-shadow: 0 0 0 3px var(--up-wash); }
.pulse.off { background: var(--down); }
.pulse.warn { background: var(--warn); }
/* the balance in the navbar, read from Kalshi every second; the eye hides the dollars and keeps the % */
.navbal { display: inline-flex; align-items: center; gap: var(--sp-2); padding-right: var(--sp-3); border-right: 1px solid var(--line); white-space: nowrap;
  font-variant-numeric: tabular-nums; transition: opacity 0.2s; }
.navbal:empty { display: none; }
.navbal.stale { opacity: 0.5; }                     /* Kalshi didn't answer the last read: this is the one before */
.nb-v { font: 600 var(--fs-4)/1 var(--sans); color: var(--ink); }
.nb-p { font: 600 var(--fs-3)/1 var(--sans); color: var(--ink-2); }
.navbal .eye { margin: 0 -4px; }
/* proof it's polling: the dot blinks once per fresh Kalshi reading (redrawn, so the animation replays), beside its time */
.nb-tick { display: inline-flex; align-items: center; gap: var(--sp-2); font: 400 var(--fs-2)/1 var(--sans); color: var(--muted); white-space: nowrap; cursor: default; }
.nb-tick:empty { display: none; }
.nb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand-ink); animation: nb-blink 0.9s ease-out both; }
.nb-dot.stale { animation: none; opacity: 1; background: var(--down); }   /* Kalshi didn't answer: red and still */
@keyframes nb-blink { 0% { opacity: 1; } 100% { opacity: 0.2; } }
@media (prefers-reduced-motion: reduce) { .nb-dot { animation-timing-function: steps(1, end); } }   /* on, then off: no fade */
.icon-btn { background: none; border: 1px solid var(--line); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); font-size: var(--fs-4); line-height: 1; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.halt-btn { height: 36px; padding: 0 var(--sp-4); border-radius: var(--r-pill); border: 1px solid var(--down-line); background: transparent; color: var(--down-ink);
  font: 600 var(--fs-3)/1 var(--sans); white-space: nowrap; }
.halt-btn:hover { background: var(--down-wash); }
.halt-btn.arm { background: var(--down); color: #fff; border-color: var(--down); }
.halt-btn:disabled { background: var(--surface-2); color: var(--muted); border-color: var(--line); cursor: default; }

/* ------------------------------------------------------------- page */
.wrap { max-width: none; margin: 0 auto; padding: var(--sp-5) var(--gutter) var(--sp-7); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); }
.banners { display: grid; gap: var(--sp-2); }
.banners:empty { display: none; }
.note { border-radius: var(--r-2); padding: var(--sp-3) var(--sp-4); font-size: var(--fs-3); background: var(--down-wash); border: 1px solid var(--down-line); }
.note b { color: var(--down-ink); }
.note.warn { background: var(--warn-wash); border-color: var(--warn-line); }
.note.warn b { color: var(--warn-ink); }
code { font: var(--fs-2) var(--mono); padding: 1px var(--sp-1); border-radius: var(--r-1); background: var(--surface-2); }

.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-3); }
.hk { display: inline-flex; align-items: center; gap: 2px; }
.eye { background: none; border: 0; width: 32px; height: 32px; margin: -8px 0; padding: 0; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.eye:hover { background: var(--hover); color: var(--ink); }
.hv { font: 600 var(--fs-7)/1 var(--cond); letter-spacing: -0.01em; margin: var(--sp-2) 0; }
.fd { font: 400 var(--fs-4)/1.3 var(--sans); font-variant-numeric: tabular-nums; }
.fmeta { margin-top: var(--sp-1); font-size: var(--fs-3); }
/* the scoreboard under the balance: settled bets won and lost, the win rate, and a bar splitting the two */
.score { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: var(--sp-3) var(--sp-6); margin-top: var(--sp-5); max-width: 470px; }
.sc { display: grid; gap: var(--sp-1); }
.sc b { font: 600 var(--fs-6)/1 var(--cond); font-variant-numeric: tabular-nums; }
.sc-bar { grid-column: 1 / -1; position: relative; height: 8px; border-radius: var(--r-pill); background: var(--down); overflow: hidden; }
.sc-bar i { display: block; height: 100%; background: var(--up); }
.sc-be { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); }   /* the break-even */
.timer { text-align: right; line-height: 1.15; }
.timer b { display: block; margin-top: var(--sp-1); font: 600 var(--fs-5)/1.1 var(--cond); color: var(--ink); }   /* a countdown, not a warning */
.timer b.down { color: var(--down-ink); }

.chart-tools { display: flex; justify-content: flex-end; gap: var(--sp-2); align-items: center; flex-wrap: wrap; min-height: 28px; }
.chips { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.grp { display: inline-flex; background: var(--surface-2); border-radius: var(--r-pill); padding: var(--sp-1); }
.grp button { background: none; border: 0; border-radius: var(--r-pill); padding: var(--sp-1) var(--sp-3); font: 600 var(--fs-2)/1 var(--sans); color: var(--muted); }
.grp button:hover { color: var(--ink); }
.grp button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-strong); }
.ghost { background: none; border: 0; padding: var(--sp-1); font: 600 var(--fs-2) var(--sans); color: var(--muted); }
.ghost:hover { color: var(--ink); }
.chart { position: relative; min-height: 220px; }
.cv { display: block; overflow: visible; }
.cv.up { --c: var(--up); } .cv.down { --c: var(--down); }
.cv text { fill: var(--muted); font: var(--fs-1) var(--mono); font-variant-numeric: tabular-nums; }
.cv .grid-l { stroke: var(--line); stroke-width: 1; }
.cv .ref { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 1 4; stroke-linecap: round; }
.cv .tagbox { fill: var(--surface-2); stroke: var(--line-strong); }
.cv .tagtxt { fill: var(--ink-2); font: 600 var(--fs-1) var(--sans); letter-spacing: 0.06em; }
.cv .valbox { fill: var(--c); }
.cv .valtxt { fill: #000; font: 600 var(--fs-1) var(--sans); font-variant-numeric: tabular-nums; }
.cv .ln { fill: none; stroke: var(--c); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.cv .dot { fill: var(--c); stroke: var(--page); stroke-width: 2; }
.cv .halo { fill: var(--c); opacity: 0.25; transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
.cv .xh { stroke: var(--line-strong); stroke-width: 1; }
.cv .hit { fill: transparent; cursor: crosshair; }
.cv .dep { fill: var(--page); stroke: var(--ink-2); stroke-width: 1.5; }
/* 1H and 6H: a faint divider at every 15-minute window, and each window that lost money shaded under the line */
.cv .wl { stroke: var(--line); stroke-dasharray: 2 4; }
.cv .lw { fill: var(--down); opacity: 0.1; }
.cv .lw-t { fill: var(--down-ink); font: 600 11px var(--sans); }
@keyframes pulse { 0% { transform: scale(1); opacity: 0.35; } 100% { transform: scale(3.2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cv .halo { animation: none; } }
/* the fill-rate fold: the answer first, two tiles (since fast entry, what it was before, the change in points, green when
   it got better), then one calm line, the last 12 windows' share filled, over the shaded fast-entry period, with each
   period's average dashed and labelled. A column per window under the pointer gives its figures. */
.fr-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, max-content)); gap: var(--sp-3) var(--sp-6); padding: var(--sp-3) var(--sp-4); }   /* side by side even on a phone: the words wrap */
.fr-tile { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: var(--sp-1) var(--sp-2); }
.fr-tl, .fr-ts { grid-column: 1 / -1; font-size: var(--fs-2); color: var(--muted); }
.fr-tl { color: var(--ink-2); }
.fr-tv { font: 600 var(--fs-6)/1 var(--cond); font-variant-numeric: tabular-nums; }
.fr-td { font: 600 var(--fs-3)/1 var(--sans); white-space: nowrap; }   /* its colour: .up (better), .down (worse), .muted */
.fr { display: block; width: 100%; height: auto; margin-bottom: var(--sp-2); font: var(--fs-1) var(--sans); }
.fr text { fill: var(--muted); }
.fr .axis { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.fr .fr-grid { stroke: var(--line); stroke-width: 1; }
.fr .fr-after { fill: var(--surface-2); }
.fr .fr-off { fill: url(#fr-hatch); }   /* time the bot wasn't trading: a painted fill, so its title shows on hover */
.fr .fr-hatch { stroke: var(--line-strong); stroke-width: 1; }
.fr .fr-off-t { fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.fr .fr-ln { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.fr .fr-avg { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 5 4; pointer-events: none; }
.fr .fr-avg-t { fill: var(--ink-2); font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.fr .fr-mark { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 1 4; stroke-linecap: round; }
.fr .fr-mark-t { fill: var(--ink-2); }
.fr .fr-hit { fill: transparent; }
.fr .fr-pt:hover .fr-hit { fill: var(--hover); }
.empty { padding: var(--sp-6) var(--sp-4); color: var(--muted); text-align: center; display: grid; gap: var(--sp-2); justify-items: center; font-size: var(--fs-3); }
.empty svg { opacity: 0.8; }
.empty b { font-size: var(--fs-4); color: var(--ink-2); }
/* an empty section inside a fold is one quiet line at row height, not a block bigger than a full one */
.empty-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--sp-2); padding: var(--sp-2) var(--sp-4); font-size: var(--fs-3); line-height: 20px; color: var(--muted); }
.empty-line b { color: var(--ink-2); }
.fold-body > .empty { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--sp-2); padding: var(--sp-2) var(--sp-4); text-align: left; line-height: 20px; }
.fold-body > .empty svg { display: none; }
.fold-body > .empty b { font-size: inherit; }

.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--r-2);
  padding: var(--sp-2) var(--sp-3); box-shadow: var(--shadow); min-width: 150px; font-size: var(--fs-2); color: var(--ink-2); }
.tip .t-when { color: var(--muted); margin-bottom: var(--sp-1); }
.tip .t-row { display: flex; justify-content: space-between; gap: var(--sp-4); align-items: baseline; }
.tip .t-row b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tip .key { display: inline-block; width: 12px; height: 2px; border-radius: var(--r-pill); background: var(--c, var(--brand)); vertical-align: middle; margin-right: var(--sp-2); }

/* ------------------------------------------------------------- the Live tab's sections: one fold each (fold() below)
   Positions, Live markets, Orders, How it trades and Details are each a fold: one hairline panel whose header keeps the
   count and the key line in view while folded. What's inside sits flush with the panel's edges (no box in a box); the
   tab's one Open all / Close all sits above them, and folded panels stack like a list, 8px apart. */
.fold-b .n { font: 400 var(--fs-2) var(--sans); color: var(--muted); }         /* the count beside a title */
.fm-ln { display: block; }                                                      /* a meta of two lines (the orders' fills) */
.live-folds { display: flex; justify-content: flex-end; margin: -16px 0; }        /* the tab's Open all / Close all, */
.live-folds + section { margin-top: -12px; }                                    /* 16px under the chart, 8px over the folds */
.live-folds:empty { display: none; }
.wrap > :has(> .fold[data-open="false"]) + :has(> .fold[data-open="false"]) { margin-top: -24px; }
.fold-body > .more { margin: var(--sp-3) auto var(--sp-4); }                    /* a long table's Show all, inside its panel */
/* a small heading and its note inside a fold, on the fold's 16px edge (the Orders fold's fills by order size) */
.sub-h { margin: 0; padding: var(--sp-3) var(--sp-4) var(--sp-1); font: 600 var(--fs-3)/20px var(--sans); color: var(--ink); }
.sub-note { margin: 0; padding: 0 var(--sp-4) var(--sp-2); font-size: var(--fs-2); color: var(--muted); }
/* the fills by order size, under the orders: a hairline across the panel sets them off, 16px clear of the last row (or
   of the Show all, whose own 16px it shares), and their table keeps its four columns together rather than stretch
   across the fold. Beside each share filled, a small bar as long as it on a quiet track; the % beside it is the same
   width on every row, so the bars line up */
.sz { margin-top: var(--sp-4); padding: var(--sp-1) 0 var(--sp-2); border-top: 1px solid var(--line); }
.sz table { width: auto; min-width: min(100%, 560px); }
.sz-bar { display: inline-block; vertical-align: middle; width: 64px; height: 6px; margin-right: var(--sp-2); border-radius: var(--r-pill);
  background: var(--line); overflow: hidden; }
.sz-bar i { display: block; height: 100%; background: var(--series-1); border-radius: inherit; }
.sz-p { display: inline-block; min-width: 4.5ch; }

/* ------------------------------------------------------------- positions: tiles, as many to a row as fit
   Hairlines part the tiles, not boxes (nothing boxed inside a fold): each tile draws the line on its right and its
   bottom, and the grid clips the ones on the panel's own edges, so a short last row leaves blank space. */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); overflow: hidden; }
.pcard { display: grid; align-content: start; gap: var(--sp-2); min-width: 0; padding: var(--sp-3) var(--sp-4); box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); }
.pcard:hover { background: var(--hover); }
.pc-top, .pc-bot { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--sp-1) var(--sp-2); }
.pc-bot { align-items: center; }
.pc-m { font-weight: 600; min-width: 0; }
.pcard .pl { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pcard .s { font-size: var(--fs-2); white-space: nowrap; }
.ext { color: var(--muted); font-size: var(--fs-2); }
.pill { display: inline-flex; align-items: center; height: 28px; padding: 0 var(--sp-3); border-radius: var(--r-pill); border: 1px solid var(--line-strong);
  font: 600 var(--fs-2)/1 var(--sans); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.yes { color: var(--up-ink); border-color: var(--up-line); background: var(--up-wash); }
.pill.no { color: var(--down-ink); border-color: var(--down-line); background: var(--down-wash); }
.chip { display: inline-block; font: 600 var(--fs-1)/1 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; padding: var(--sp-1) var(--sp-2); border-radius: var(--r-pill);
  border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap; }
.chip.won, .chip.bet { color: var(--up-ink); border-color: var(--up-line); background: var(--up-wash); }
.chip.lost, .chip.error { color: var(--down-ink); border-color: var(--down-line); background: var(--down-wash); }
.chip.halted { color: var(--warn-ink); border-color: var(--warn-line); background: var(--warn-wash); }

/* ------------------------------------------------------------- the quiet rows, inside the Details fold */
.acc + .acc { border-top: 1px solid var(--line); }
/* the same chevron as a fold's, first in the row and on the same 16px edge, so every toggle on the tab reads alike */
.acc summary { list-style: none; display: flex; align-items: center; gap: var(--sp-2); min-height: 44px; padding: var(--sp-2) var(--sp-4); font-size: var(--fs-4); cursor: pointer; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary:hover { background: var(--hover); }
.acc .sum { margin-left: auto; color: var(--muted); font-size: var(--fs-2); text-align: right; font-variant-numeric: tabular-nums; }
.acc .chev { flex: none; width: 7px; height: 7px; margin: 0 1px 0 0; border: solid var(--muted); border-width: 0 1.5px 1.5px 0;
  transform: rotate(-45deg); transition: transform 0.15s; }

   single line, a heading holding one button (the chevron, then the title) with the meta muted at the right, outside the
   button so it stays in view while folded; the body's top rule takes over from the header's, so a folded section is

.fold { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-2); }

  border-radius: var(--r-1); text-align: left; font: inherit; letter-spacing: inherit; color: var(--ink); }

@media (min-width: 1100px) {

.ok::after { content: ""; position: absolute; left: 4px; top: 2.5px; width: 4px; height: 7px; border: solid var(--up-ink); border-width: 0 1.6px 1.6px 0; transform: rotate(40deg); }

td.what, th.what { padding-left: var(--sp-4); }

.more:hover { color: var(--ink); }
.sw-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-1) 0 var(--sp-3); font-size: var(--fs-3); color: var(--muted); }

@media (max-width: 560px) {
  /* the tabs take a row of their own under the bar, so none is ever cut off; the bar keeps the balance, the status and

  .top-in { flex-wrap: wrap; padding: var(--sp-2) var(--sp-4) 0; gap: var(--sp-1) var(--sp-2); min-height: 0; }

  .status { font-size: 0; gap: 0; }                      /* the dot alone; the words are in the page */

  .navbal .nb-p:first-child { grid-row: span 2; }          /* the balance hidden: the % alone, centred */
  .nb-v { font-size: var(--fs-3); }
  .nb-p { font-size: var(--fs-2); }
  .nb-t { display: none; }                                 /* the blinking dot alone */
  .score { gap: var(--sp-3) var(--sp-5); }
  .sc b { font-size: var(--fs-5); }
  .halt-btn { height: 34px; padding: 0 var(--sp-3); font-size: var(--fs-2); }
  .icon-btn { width: 44px; height: 44px; border-color: transparent; }   /* a full-size tap target, its ring dropped */
  .wrap { padding: var(--sp-4) var(--sp-4) var(--sp-7); gap: var(--sp-5); }
  .wrap > :has(> .fold[data-open="false"]) + :has(> .fold[data-open="false"]) { margin-top: -16px; }   /* still 8px apart */
  .live-folds { margin: -8px 0 -16px; }
  .live-folds + section { margin-top: 0; }
  .hv { font-size: 48px; }
  .timer { display: none; }
  .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }   /* two tiles a row on a phone */
  .pcard { padding: var(--sp-3); }
  .pc-top, .pc-bot { flex-direction: column; align-items: flex-start; }   /* each line under the last: every tile alike */
  .fold-m { flex-basis: 100%; margin-left: 0; padding: 0 0 var(--sp-2) var(--sp-5); text-align: left; }   /* a fold's meta under its title */
  /* tap targets at least 44px tall */
  .grp button, .ghost, .folds-b { min-height: 44px; }
  .grp button { padding: 0 var(--sp-3); }
  .bd-t th, .bd-t td, #orders th, #orders td, #orders th.num, #orders td.num { padding-left: var(--sp-2); padding-right: var(--sp-2); }   /* the board fits a phone */
  #orders td:nth-child(2) { white-space: nowrap; }         /* a market's name on one line: rows stay two lines tall */
  .bd-in { margin-left: var(--sp-1); }

  .sz th.num { white-space: normal; }                      /* "Contracts filled" too: the fill sizes fit a 375px phone */
  /* a wide table scrolls inside its panel; its first column (the market) stays in view */
  .bd-wrap th:first-child, .bd-wrap td:first-child, .fold .table-wrap th:first-child, .fold .table-wrap td:first-child {

  .hide-sm { display: none; }

}

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const nf = (v, dp = 2) => Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
const zero = (v, dp = 2) => Math.abs(v) < 0.5 * Math.pow(10, -dp);            // rounds to nothing: no sign, no colour
const money = (v, dp = 2) => v == null ? "—" : (v < 0 && !zero(v, dp) ? "−$" : "$") + nf(v, dp);
const signed = (v, dp = 2) => v == null ? "—" : (zero(v, dp) ? "" : v > 0 ? "+" : "−") + "$" + nf(v, dp);
const pct = (v, dp = 1) => v == null ? "—" : (v * 100).toFixed(dp) + "%";
const limitPct = (v) => v == null ? "—" : +(v * 100).toFixed(1) + "%";   // a limit as set: 1.5%, 10% (no stray .0, no rounding 1.5 up to 2)
const winRate = (d) => d.winShare ?? (d.wins + d.losses ? d.wins / (d.wins + d.losses) : null);   // per contract, as the break-even is (per bet from an older server)
const spct = (v, dp = 1) => v == null ? "—" : (zero(v * 100, dp) ? "" : v > 0 ? "+" : "−") + Math.abs(v * 100).toFixed(dp) + "%";
const tone = (v) => v == null || zero(v) ? "" : v > 0 ? "up" : "down";
const arrow = (v) => tone(v) === "up" ? "▲ " : tone(v) === "down" ? "▼ " : "";
const cents = (p) => p == null ? "—" : (Math.abs(p * 100 - Math.round(p * 100)) < 0.05 ? String(Math.round(p * 100)) : (p * 100).toFixed(1)) + "¢";
const hhmm = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const hms = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
const when = (t) => {
  const d = new Date(t * 1000), today = new Date();
  return d.toDateString() === today.toDateString() ? hhmm(t) : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + hhmm(t);
};
const sym = (series) => (series || "").replace(/^KX/, "").replace(/15M$/, "");
const clock = (s) => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.floor(Math.max(0, s) % 60)).padStart(2, "0")}`;
const entryText = (left, minute) => left > 0 ? `entry in ${clock(left)}` : `entry was minute ${minute}`;
const count = (n) => Number(n).toLocaleString("en-US");
const title = (series) => sym(series) + " 15 min";
// The 15-minute window's page on Kalshi: /markets/{series}/{slug}/{event}; Kalshi fixes the slug if it's off.
const kalshiUrl = (ticker) => {
  const p = ticker.split("-"), s = p[0].toLowerCase();
  return p.length < 2 ? `https://kalshi.com/markets/${s}` : `https://kalshi.com/markets/${s}/${s}/${p.slice(0, 2).join("-").toLowerCase()}`;
};
const market = (b) => `<a href="${esc(kalshiUrl(b.ticker))}" target="_blank" rel="noopener" title="${esc(b.ticker)} on Kalshi">${esc(title(b.series))}<span class="ext"> ↗</span></a>`;
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const label = (m) => ({ "live-prod": "Live", "live-demo": "Demo", "dry-prod": "Paper" })[m] || m;   // the paper ledger's tab; live tabs only while there's none (dashboard.modes)
const LIMITS = { betPct: 0.015, windowPct: 0.10, ordersPerWindow: 20, ordersPerDay: 600, minCash: 67, dayDrop: 0.35, halfStart: 0.5,
                 windowLosses: 8, settleLag: 1800, persist: 300, orderErrors: 3,
                 minute: 8, lo: 0.92, hi: 0.999, limitUp: 0, shadowUp: 0.01, grace: 45, spreadMax: 0.02, lateMid: 0.50, jump: 0.10, orderDeadline: 60, bookMaxAge: 15,
                 restingEvery: 15, orderConnect: 3.05, orderAnswer: 5 };   // only until the server says what the bot enforces

const parse = (k, dflt) => { try { return JSON.parse(store.get(k)) ?? dflt; } catch { return dflt; } };
let data = null, mode = store.get("mode"), range = store.get("range") || "all", unit = store.get("unit") || "usd";
let view = "chart", skew = 0, armed = false, armTimer = null, running = false, hovering = false, cm = null, ids = [];
let openSecs = new Set(parse("open", [])), fullTables = new Set(), showSkips = store.get("skips") === "1", chartOpts = store.get("chartOpts") === "1";
let hideBal = store.get("hideBal") === "1";
// Live Research ("liveresearch", live_research.js), Latency ("latency", latency.js) and Backtest ("backtest",
// backtest.js) fetch their own data, and are remembered across reloads. Anything else opens the account, a
// "research" page remembered from the backtests' tab (taken off the page on Oct 15) included.
let page = ["liveresearch", "latency", "backtest"].includes(store.get("page")) ? store.get("page") : "account";
// ------------------------------------------------------------------ folds: a section that shrinks to its header line
// The Live, Live Research and Latency pages fold alike: a heading holding one button (a chevron and the
// title), the section's meta beside it and still in view while folded, and a body that is only hidden, so folded
// content stays in the page. FOLDS: every fold key on the first two -> open on a first visit (Latency passes its own). `folds`: the viewer's
// own choices, kept in localStorage "folds"; a stored value that isn't an object, or a choice that isn't true or false,
// is ignored. A page may give a fold a default of its own as it draws it (dflt, a boolean): the live +1¢ card opens
// by default once it's on. Keys hold only a-z, 0-9, dots and dashes; titles are the page's own words, meta and body
// arrive escaped.
const FOLDS = {
  "live.positions": true, "live.board": true, "live.fills": true, "live.orders": false, "live.method": false, "live.details": true,
  "lr.shadow": true, "lr.shadow.about": false, "lr.shadow.extra": true, "lr.shadow.pred": false, "lr.shadow.latest": false,
  "lr.fast": true, "lr.fast.about": false, "lr.fast.vs": true, "lr.fast.latest": false,
  "lr.limit": false, "lr.limit.about": false, "lr.limit.fills": false, "lr.limit.extra": true, "lr.limit.pred": false,
  "lr.limit.latest": false, "lr.terms": false,
};
let folds = ((v) => (v && typeof v === "object" && !Array.isArray(v) ? v : {}))(parse("folds", {}));
const foldOpen = (key, dflt) => typeof folds[key] === "boolean" ? folds[key] : typeof dflt === "boolean" ? dflt : !!FOLDS[key];
function fold(key, name, body, meta = "", cls = "", dflt) {
  const open = foldOpen(key, dflt);
  return `<section class="fold${cls ? " " + cls : ""}" data-fold-key="${key}" data-open="${open}"><div class="fold-h"><h2 class="fold-t">`
    + `<button type="button" class="fold-b" data-fold="${key}" aria-expanded="${open}" aria-controls="fold-${key}"><i class="chev" aria-hidden="true"></i>${name}</button>`
    + `</h2>${meta ? `<span class="fold-m">${meta}</span>` : ""}</div><div class="fold-body" id="fold-${key}"${open ? "" : " hidden"}>${body}</div></section>`;
}
// The page's one Open all (while any of its folds is closed) or Close all; it carries the keys it sets.
function foldsButton(keys, dflts = {}) {
  const any = keys.some((k) => !foldOpen(k, dflts[k]));
  return `<button type="button" class="folds-b" data-folds="${any ? "open" : "close"}" data-fold-keys="${keys.join(" ")}">${any ? "Open all" : "Close all"}</button>`;
}
// A choice made: these folds open (or close) where they stand, at once and with no fetch, and the choice is saved so
// every later redraw draws them the same; each Open all / Close all relabels itself from what's on screen.
function foldSet(keys, open) {
  for (const k of keys) {
    folds[k] = open;
    const body = $("fold-" + k), sec = body && body.parentElement;
    if (sec) { body.hidden = !open; sec.dataset.open = open; sec.querySelector(".fold-b").setAttribute("aria-expanded", open); }
  }
  store.set("folds", JSON.stringify(folds));
  document.querySelectorAll("[data-folds]").forEach((b) => {
    const any = (b.dataset.foldKeys || "").split(" ").some((k) => { const f = k && $("fold-" + k); return f ? f.hidden : !!k && !foldOpen(k); });
    b.dataset.folds = any ? "open" : "close"; b.textContent = any ? "Open all" : "Close all";
  });
}
// The Live tab's folds, top to bottom; its one Open all / Close all sets them all, and every Details row with them.
const LIVE_FOLDS = Object.keys(FOLDS).filter((k) => k.startsWith("live."));
const shown = new Map();
// Write a region only when its markup changed, so an unchanged refresh (every second) never disturbs hover, focus or scroll.
function patch(id, html) {
  if (shown.get(id) === html) return false;
  shown.set(id, html);
  $(id).innerHTML = html;
  return true;
}
const nowS = () => Date.now() / 1000 + skew;

// The Live tab's state, read every STATE_EVERY ms. One read at a time: while one is out, a tick (or a click) skips.
// An answer for an account the viewer has since left for another is dropped, so the account picked mid-read is the
// one that shows, on the next tick.
const STATE_EVERY = 1000;
let loading = false;
async function load() {
  if (loading) return;
  loading = true;
  const asked = mode;
  try {
    const r = await fetch("/api/state" + (mode ? "?mode=" + encodeURIComponent(mode) : ""), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (mode !== asked) return;
    data = d;
    skew = (data.now || Date.now() / 1000) - Date.now() / 1000;
    document.body.classList.remove("offline");
    render();
  } catch (e) {
    document.body.classList.add("offline");          // keep the last picture, dimmed, rather than blanking it
    status("off", "Can't reach the dashboard's server");
  } finally {
    loading = false;
  }
}

function status(kind, text) {
  $("pulse").className = "pulse " + kind;
  $("statusText").textContent = text;
}

const ICON_LIST = `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 9h8M8 12.5h8M8 16h5" stroke-linecap="round"/></svg>`;
const emptyState = (text, sub) => `<div class="empty">${ICON_LIST}<b>${text}</b>${sub ? `<span>${sub}</span>` : ""}</div>`;
const eyeIcon = (off) => `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>${off ? `<path d="M4 4l16 16"/>` : ""}</svg>`;

// The scoreboard under the balance: settled bets won and lost, then the win rate against the break-even. Both rates are
// per contract (the break-even is the all-in cost per contract), so they compare: a per-bet rate made a winning bot
// look like a losing one, its few losses being small early bets. The bar is the win rate, ticked at the break-even.
// No dollar figure, so it stays when the balance is hidden; a count is coloured only when it isn't zero.
// The scoreboard sits straight under the headline, so with a simulated account showing it is that account's
// record, not the paper bot's handful of bets since Nov 3, which would read as the simulation's own.
const simScore = (s) => ({ wins: s.wins || 0, losses: (s.bets || 0) - (s.wins || 0), winShare: s.winRate, need: s.need });

function scoreBlock(d) {
  if (d.sim) d = simScore(d.sim);   // with a simulated account showing, the scoreboard is its record
  const n = d.wins + d.losses;
  if (!n) return `<div class="score muted s">No bets settled yet</div>`;
  const w = winRate(d), rate = pct(w, 1), be = d.need == null ? null : pct(d.need, 1);
  return `<div class="score" role="group" aria-label="Record: ${d.wins} won, ${d.losses} lost; ${rate} of contracts won${be ? `, break-even ${be}` : ""}" title="Settled bets: ${d.wins} won, ${d.losses} lost">
      <span class="sc"><b${d.wins ? ' class="up"' : ""}>${d.wins}</b> <span class="k">Won</span></span>
      <span class="sc"><b${d.losses ? ' class="down"' : ""}>${d.losses}</b> <span class="k">Lost</span></span>
      <span class="sc" title="Share of contracts that won; break-even is per contract too"><b>${rate}</b> <span class="k">Win rate</span></span>
      ${be ? `<span class="sc" title="The win rate that breaks even: the all-in cost per contract, fees included"><b>${be}</b> <span class="k">Break-even</span></span>` : ""}
      <div class="sc-bar" aria-hidden="true"><i style="width:${+(w * 100).toFixed(2)}%"></i>${be ? `<b class="sc-be" style="left:${+(d.need * 100).toFixed(2)}%"></b>` : ""}</div>
    </div>`;
}

// ------------------------------------------------------------------ render
function render() {
  const d = data, lab = page === "liveresearch", lat = page === "latency", bt = page === "backtest";
  const other = lab || lat || bt;                                   // other: a tab that isn't the account
  patch("modes", (d.modes || []).map((m) => `<button class="nav-b" type="button" data-mode="${esc(m)}" aria-current="${!other && m === d.mode}">${esc(label(m))}</button>`).join("")
    + `<button class="nav-b" type="button" data-page="liveresearch" aria-current="${lab}">Live Research</button>`
    + `<button class="nav-b" type="button" data-page="latency" aria-current="${lat}">Latency</button>`
    + `<button class="nav-b" type="button" data-page="backtest" aria-current="${bt}">Backtest</button>`);
  for (const id of ["hero", "chartPanel", "board", "fills", "positions", "orders", "method", "more"]) $(id).hidden = other;
  $("liveFolds").hidden = other;
  $("liveresearch").hidden = !lab;
  $("latency").hidden = !lat;
  $("backtest").hidden = !bt;
  document.body.classList.toggle("wide", other);
  if (!d.modes || !d.modes.length) return renderEmpty();
  mode = d.mode;
  const L = Object.assign({}, LIMITS, d.limits);
  const equity = d.bankroll + (d.unrealized || 0), diff = equity - d.start;
  const acct = d.kalshi && !d.kalshi.error && d.kalshi.value != null ? d.kalshi : null;   // your real Kalshi account, live
  // a paper mode with a simulated account (d.sim): the hero and the chart lead with the sim, not the dry ledger's books
  const sim = d.sim && d.sim.value != null ? d.sim : null;
  const simFunds = sim ? fundsLine({ ...d, live: false, start: sim.start }, sim.value) : "";
  // its start date read in UTC: t0 is midnight UTC, which is still the day before west of London
  const simNote = sim ? `Simulated ${money(sim.start, 0)} since ${new Date(Date.parse(sim.t0)).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" })} · replayed on real prices and real book depth` : "";
  const age = d.heartbeat ? d.now - d.heartbeat : null;
  running = age != null && age < 30;
  const halted = !!d.halt, paused = !!(d.blackout && d.blackout.active);

  // header
  if (halted) status("warn", "Halted");
  else if (running) status("on", "Running");
  else status("off", "Not running");
  patch("haltTop", haltButton());
  $("skin").setAttribute("aria-pressed", String(document.documentElement.dataset.skin === "exchange"));

  // the things worth interrupting you for
  const b = [];
  if (halted) b.push(`<div class="note" role="alert"><b>Trading halted</b> since ${when(Date.parse(d.halt.ts) / 1000)} · ${esc(d.halt.reason)}. No new orders until you run <code>python bot.py --resume</code>. Open bets still settle.</div>`);
  else if (paused) b.push(`<div class="note warn" role="status"><b>${esc(d.blackout.what)} blackout</b> no new bets until ${hhmm(d.blackout.to)}</div>`);
  if (!running) b.push(`<div class="note warn" role="status"><b>Bot not running</b> ${d.heartbeat ? "last seen " + when(d.heartbeat) + ". " : ""}Nothing is being bought. Start it with <code>python bot.py ${d.live ? "--live" + (d.env === "prod" ? " --env prod" : "") : ""}</code>.</div>`);
  const idle = acct && acct.crypto != null ? acct.total - acct.crypto : 0;   // cash in sections the bot can't bet from
  if (idle >= 0.01) b.push(`<div class="note warn" role="status"><b>${hideBal ? "Some cash" : money(idle)} outside Crypto &amp; Commodities</b> It's in another section of your Kalshi account, which the bot can't bet from. Move it with <code>python bot.py --fund-crypto</code>.</div>`);
  const gap = bookGap(d, equity, acct, hideBal);
  if (gap) b.push(gap);
  if (d.live && d.kalshi && d.kalshi.crypto != null && d.kalshi.crypto < L.minCash) b.push(`<div class="note warn" role="status"><b>Low cash for these markets</b> ${money(d.kalshi.crypto)} in Kalshi's Crypto &amp; Commodities section, under the ~${money(L.minCash, 0)} a $1 bet needs. Move cash there with <code>python bot.py --fund-crypto</code>.</div>`);
  const restart = restartNote(d);

  patch("banners", other ? (halted ? b[0] : "") : b.join(""));

  // the account, in one glance; with the balance hidden, the change since the start in % takes its place
  const r = sim ? (sim.start ? sim.value / sim.start - 1 : null) : d.start ? diff / d.start : null;   // the sim's own change on a paper mode
  const rp = r == null ? null : Math.round(r * 1000) / 10;   // rp: the % as shown, so its colour and arrow agree with it
  const openN = d.openBets.length ? `${d.openBets.length} open bet${d.openBets.length === 1 ? "" : "s"}` : "";
  patch("hero", `
    <div class="hero-top"><span class="hk"><span class="k">Portfolio${d.mode === "live-prod" ? "" : " · " + esc(label(d.mode))}</span><button class="eye" type="button" data-bal aria-pressed="${hideBal}" aria-label="Hide balance" title="${hideBal ? "Show" : "Hide"} balance">${eyeIcon(hideBal)}</button></span><div class="timer" id="timer" aria-live="off"></div></div>
    ${hideBal ? `
    <div class="hv ${tone(rp)}">${spct(r)}</div>
    <div class="fd ${tone(rp)}">${arrow(rp)}since the start</div>
    <div class="fmeta muted">Balance hidden${openN ? " · " + openN : ""}</div>` : `
    <div class="hv">${money(sim ? sim.value : acct ? acct.value : equity)}</div>
    ${sim ? simFunds : fundsLine(d, equity) + stakedLine(d.staked)}
    <div class="fmeta muted">${sim ? simNote : acct ? `Live from Kalshi: ${money(acct.total)} cash${acct.held >= 0.005 ? ` · ${money(acct.held)} in open positions` : ""}`
      : "From the bot's books"}${openN ? " · " + openN : ""}</div>`}
    ${scoreBlock(d)}`);
  if (lab) { if (window.liveResearchView) liveResearchView(); }   // live_research.js loads after this script
  else if (lat) { if (window.latencyView) latencyView(); }        // ... and latency.js
  else if (bt) { if (window.backtestView) backtestView(); }      // ... and backtest.js
